plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "maven.modrinth:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

def generateBuildConfig = tasks.register("generateBuildConfig") {
    def isPremium = project.hasProperty("premium") ? project.property("premium").toString().toBoolean() : false
    inputs.property("premium", isPremium)
    def outputDir = file("$buildDir/generated/sources/buildconfig/java/main/com/github/secondlifegaming/macromod")
    outputs.dir(outputDir)
    doLast {
        outputDir.mkdirs()
        new File(outputDir, "BuildConfig.java").text = """package com.github.secondlifegaming.macromod;

public class BuildConfig {
    public static final boolean IS_PREMIUM = ${isPremium};
}
"""
    }
}

sourceSets.main.java.srcDir "$buildDir/generated/sources/buildconfig/java/main"
compileJava.dependsOn generateBuildConfig
sourcesJar.dependsOn generateBuildConfig

jar {
    def edition = project.hasProperty("premium") && project.property("premium").toString().toBoolean() ? "premium" : "free"
    archiveFileName.set("${project.archives_base_name}-${project.version}-${edition}.jar")
}

