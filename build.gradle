plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "maven.modrinth:modmenu:${project.modmenu_version}"
    implementation "org.lwjgl:lwjgl-glfw:3.4.3"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    free {
        java {
            srcDirs = ['src/free/java']
        }
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += sourceSets.main.output + configurations.runtimeClasspath
    }
    premium {
        java {
            srcDirs = ['src/premium/java']
        }
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += sourceSets.main.output + configurations.runtimeClasspath
    }
    test {
        compileClasspath += sourceSets.premium.output + sourceSets.main.output
        runtimeClasspath += sourceSets.premium.output + sourceSets.main.output
    }
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.register('buildFreeJar', Jar) {
    dependsOn compileJava, compileFreeJava, processResources
    archiveFileName = "${project.archives_base_name}-${project.version}-free.jar"
    from sourceSets.main.output
    from sourceSets.free.output
}

tasks.register('buildPremiumJar', Jar) {
    dependsOn compileJava, compilePremiumJava, processResources
    archiveFileName = "${project.archives_base_name}-${project.version}-premium.jar"
    from sourceSets.main.output
    from sourceSets.premium.output
}

tasks.register('buildAll') {
    dependsOn buildFreeJar, buildPremiumJar
    if (findProject(':macromod-server:common') != null) {
        dependsOn ':macromod-server:common:build'
    }
}

tasks.register('copyToRelease', Copy) {
    dependsOn buildAll
    from 'build/libs/macromod-' + project.version + '-free.jar'
    from 'build/libs/macromod-' + project.version + '-premium.jar'
    from('macromod-server/common/build/libs/common-' + project.version + '.jar') {
        rename { "macromod-server-${project.version}.jar" }
    }
    into 'release'
}

build.finalizedBy copyToRelease
build.dependsOn buildAll

